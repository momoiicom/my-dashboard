name: Checks

on:
  pull_request:
  push:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Set test environment
        run: |
          echo "DATABASE_URL=file:./ci.db" >> "$GITHUB_ENV"
          echo "NEXTAUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
          ci_session_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$ci_session_secret"
          echo "NEXTAUTH_SECRET=$ci_session_secret" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:boards:migration
      - run: npm run test:appearance:migration
      - run: npm run test:smoke
      - run: npm run test:boards:api
      - run: node_modules/.bin/tsx scripts/bot-contract.ts
      - run: node_modules/.bin/tsx scripts/bot-smoke.ts
      - run: npm run test:arrange
      - run: npm run test:sharing:auth
      - run: npm run test:sharing:api
      - run: npm run test:appearance:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:push:browser
      - run: npm run test:e2e
      - run: npm run test:e2e:boards
      - run: npm run test:e2e:sharing
      - run: npm run test:e2e:appearance
